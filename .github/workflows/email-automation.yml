name: Email Automation

on:
  # Allow manual runs from GitHub Actions
  workflow_dispatch:

permissions:
  contents: read

# Prevent overlapping workflow runs
concurrency:
  group: email-automation
  cancel-in-progress: false

jobs:
  email-automation:
    name: Run Email Automation
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      # Step 1: Download repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Step 3: Install dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gspread google-auth google-genai

      # Step 4: Run Python automation
      - name: Run Email Automation
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          MAILBOXES_JSON: ${{ secrets.MAILBOXES_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

          # Dry Run is enabled by default for safe testing
          DRY_RUN: ${{ secrets.DRY_RUN || 'true' }}

          PYTHONUNBUFFERED: "1"

        run: python main.py
