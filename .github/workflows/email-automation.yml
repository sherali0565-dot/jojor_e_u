name: Email Automation

on:
  schedule:
    - cron: '0 8-17/2 * * 1-5'  # Runs every 2 hours during daytime, adjust as needed
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gspread google-auth requests

      - name: Run Email Automation Script
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          MAILBOXES_JSON: ${{ secrets.MAILBOXES_JSON }}
          HAMZA_SIGNATURE: ${{ secrets.HAMZA_SIGNATURE }}
          ARSLAN_SIGNATURE: ${{ secrets.ARSLAN_SIGNATURE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          OLLAMA_MODEL: ${{ secrets.OLLAMA_MODEL }}
        run: |
          python main.py

      - name: Git Commit and Push (Keep-Alive Heartbeat)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: keep-alive activity heartbeat [skip ci]" || echo "No changes to commit"
          git pull --rebase origin ${{ github.ref_name }} || echo "No remote changes to rebase"
          git push origin ${{ github.ref_name }}
