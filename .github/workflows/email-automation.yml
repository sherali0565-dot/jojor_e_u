
name: Email Automation

on:
  schedule:
    # GitHub scheduled runs are approximate; every 5 minutes.
    - cron: "*/5 * * * *"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: email-automation
  cancel-in-progress: false

jobs:
  email-automation:
    name: Run Email Automation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install gspread google-auth google-genai

      - name: Run Email Automation
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          MAILBOXES_JSON: ${{ secrets.MAILBOXES_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HAMZA_SIGNATURE: ${{ secrets.HAMZA_SIGNATURE }}

          DRY_RUN: ${{ secrets.DRY_RUN || 'false' }}
          PYTHONUNBUFFERED: "1"

        run: python main.py
