name: Email Automation

on:
  schedule:
    - #cron: "*/5 * * * *"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: email-automation
  cancel-in-progress: false

jobs:
  email-automation:
    name: Run Email Automation

    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install gspread google-auth requests beautifulsoup4

      - name: Run Email Automation
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          MAILBOXES_JSON: ${{ secrets.MAILBOXES_JSON }}
          HAMZA_SIGNATURE: ${{ secrets.HAMZA_SIGNATURE }}
          ARSLAN_SIGNATURE: ${{ secrets.ARSLAN_SIGNATURE }}
          ENFORCE_SEND_WINDOW: ${{ secrets.ENFORCE_SEND_WINDOW }}

          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}

          GEMINI_MODEL: auto
          OPENROUTER_MODEL: openrouter/auto
          OLLAMA_MODEL: auto

          PYTHONUNBUFFERED: "1"

        run: python main.py
